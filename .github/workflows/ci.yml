name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==================================================================================== #
  # WORKFLOW SECURITY
  # ==================================================================================== #
  zizmor:
    name: Workflow Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
        continue-on-error: true

  # ==================================================================================== #
  # LINT, FORMAT, TYPE CHECK
  # ==================================================================================== #
  lint-format-typecheck:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v6
        with:
          enable-cache: true
          version: "0.9.12"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check
          version: "0.14.0"

      - name: Run ruff format check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check
          version: "0.14.0"

      - name: Run ty type checker
        run: uv run ty check src

  # ==================================================================================== #
  # SMOKE TESTS (Key configurations to catch issues early)
  # ==================================================================================== #
  smoke-test:
    name: Smoke Test - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [lint-format-typecheck]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
          - os: ubuntu-latest
            python-version: "3.10"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v6
        with:
          enable-cache: true
          version: "0.9.12"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -n auto --reruns 2 --reruns-delay 1
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: 1

  # ==================================================================================== #
  # FULL TEST MATRIX (Runs after smoke tests pass)
  # ==================================================================================== #
  test:
    name: Test - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [smoke-test]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
          - os: ubuntu-latest
            python-version: "3.10"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v6
        with:
          enable-cache: true
          version: "0.9.12"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=debug_toolbar --cov-report=term-missing --cov-report=xml -n auto --reruns 2 --reruns-delay 1
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: 1

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==================================================================================== #
  # CI SUCCESS
  # ==================================================================================== #
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-format-typecheck, smoke-test, test]
    if: always()
    steps:
      - name: Check CI results
        run: |
          if [[ "${NEEDS_LINT_RESULT}" != "success" || \
                "${NEEDS_SMOKE_RESULT}" != "success" || \
                "${NEEDS_TEST_RESULT}" != "success" ]]; then
            echo "CI failed!"
            exit 1
          fi
          echo "CI passed!"
        env:
          NEEDS_LINT_RESULT: ${{ needs.lint-format-typecheck.result }}
          NEEDS_SMOKE_RESULT: ${{ needs.smoke-test.result }}
          NEEDS_TEST_RESULT: ${{ needs.test.result }}
