name: Examples (latest dependencies)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'tests/examples/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/examples-latest.yml'

concurrency:
  group: examples-latest-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples-latest:
    name: Examples - Python ${{ matrix.python-version }} (latest deps)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v6
        with:
          enable-cache: true
          version: "0.9.12"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with latest allowed versions
        run: uv sync --all-extras --upgrade

      - name: Print resolved versions of key frameworks
        run: |
          uv pip list | grep -Ei '^(litestar|starlette|fastapi|strawberry-graphql|advanced-alchemy|sqlalchemy|aiosqlite|mcp|uvicorn|jinja2|httpx) '

      - name: Run example tests
        run: uv run pytest tests/examples -v
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: 1
